{% extends "base.html" %}
{% block titulo %}Registrar novedad{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3">Registrar novedad</h1>
<form method="post" class="col-md-6">
  <div class="mb-3"><label class="form-label">Placa</label>
    <input class="form-control text-uppercase" name="placa" value="{{ placa }}" placeholder="ABC123" required></div>
  <div class="mb-3"><label class="form-label">Descripción</label>
    <textarea class="form-control" name="descripcion" rows="4" maxlength="500"
              placeholder="Ej.: rayón en la puerta trasera derecha"></textarea></div>
  <button class="btn btn-primary">Guardar novedad</button>
</form>
{% endblock %}
