{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-4">Parqueadero Autos Colombia</h1>
        <form method="post">
          <div class="mb-3"><label class="form-label">Usuario</label>
            <input class="form-control" name="usuario" required autofocus></div>
          <div class="mb-3"><label class="form-label">Contraseña</label>
            <input class="form-control" type="password" name="clave" required></div>
          <button class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
